syntax = "proto3";

package qaihm;

import "model_manifest.proto";
import "shared/runtime.proto";

message ReleaseManifestModelUrls {
  string info = 1 [deprecated = true];  // Replaced by manifest; unused (and unset) starting in v0.68.0
  string manifest = 5; // Used starting in v0.68.0; unset beforehand
  string perf = 2;
  string numerics = 3;
  string release_assets = 4;

  // ModelManifest with `_internal` set. Only set in the internal (private bucket) release manifest.
  string internal_manifest = 6;
}

message ReleaseManifestModelEntry {
  string id = 1;
  string display_name = 2;
  ModelDomain domain = 3;
  ReleaseManifestModelUrls manifest_urls = 4;

  // Fields 5-8 (the model-filter fields) were added in AI Hub Models 0.56.0.
  // They are unset/empty in manifests from earlier releases, so consumers must
  // only rely on them when the manifest version is >= 0.56.0.

  // Whether the model has any quantized (non-float) released assets.
  bool is_quantized = 5;

  // Runtimes for which the model has released assets.
  repeated Runtime supported_runtimes = 6;

  // Chipsets on which the model has been profiled.
  repeated string supported_chipsets = 7;

  // Tags applied to the model (mirrors ModelManifest.tags).
  repeated ModelTag tags = 8;

  // The model's use case (mirrors ModelManifest.use_case). Added in AI Hub Models
  // 0.56.0; unset (MODEL_USE_CASE_UNSPECIFIED) in earlier manifests.
  ModelUseCase use_case = 9;
}

message ReleaseManifest {
  string version = 1;
  string platform_url = 2;
  repeated ReleaseManifestModelEntry models = 3;
}
