syntax = "proto3";

package qaihm;

import "platform.proto";
import "model_numerics.proto";
import "shared/precision.proto";
import "shared/runtime.proto";

enum ModelLicense {
  MODEL_LICENSE_UNSPECIFIED = 0;

  // General
  MODEL_LICENSE_UNLICENSED = 1;
  MODEL_LICENSE_COMMERCIAL = 2;
  MODEL_LICENSE_AI_HUB_MODELS_LICENSE = 3;

  // Non-restrictive
  MODEL_LICENSE_APACHE_2_0 = 4;
  MODEL_LICENSE_MIT = 5;
  MODEL_LICENSE_BSD_3_CLAUSE = 6;
  MODEL_LICENSE_CC_BY_4_0 = 7;

  // Copyleft (derivative works must have the same license)
  MODEL_LICENSE_AGPL_3_0 = 8;
  MODEL_LICENSE_GPL_3_0 = 9;
  MODEL_LICENSE_CREATIVEML_OPENRAIL_M = 10;

  // Commercial use prohibited
  MODEL_LICENSE_CC_BY_NON_COMMERCIAL_4_0 = 11;
  MODEL_LICENSE_OTHER_NON_COMMERCIAL = 12;

  // Licenses for specific models
  MODEL_LICENSE_LLAMA2 = 13;
  MODEL_LICENSE_LLAMA3 = 14;
  MODEL_LICENSE_TAIDE = 15;
  MODEL_LICENSE_FALCON3 = 16;
  MODEL_LICENSE_GEMMA = 17;
  MODEL_LICENSE_LFM1_0 = 18;
  MODEL_LICENSE_AIMET_MODEL_ZOO = 19;
  MODEL_LICENSE_SAM3 = 20;
}

enum ModelDomain {
  MODEL_DOMAIN_UNSPECIFIED = 0;
  MODEL_DOMAIN_COMPUTER_VISION = 1;
  MODEL_DOMAIN_MULTIMODAL = 2;
  MODEL_DOMAIN_AUDIO = 3;
  MODEL_DOMAIN_GENERATIVE_AI = 4;
}

enum ModelTag {
  MODEL_TAG_UNSPECIFIED = 0;
  MODEL_TAG_BACKBONE = 1;
  MODEL_TAG_REAL_TIME = 2;
  MODEL_TAG_FOUNDATION = 3;
  MODEL_TAG_LLM = 4;
  MODEL_TAG_GENERATIVE_AI = 5;
  MODEL_TAG_BU_IOT = 6;
  MODEL_TAG_BU_AUTO = 7;
  MODEL_TAG_BU_COMPUTE = 8;
  MODEL_TAG_MOE = 9;
  MODEL_TAG_VLM = 10;
  MODEL_TAG_ROBOTICS = 11;
}

enum VoiceAISdk {
  VOICE_AI_SDK_UNSPECIFIED = 0;
  VOICE_AI_SDK_ASR = 1;
  VOICE_AI_SDK_TTS = 2;
  VOICE_AI_SDK_TRANSLATION = 3;
}

enum ModelUseCase {
  MODEL_USE_CASE_UNSPECIFIED = 0;

  // Image
  MODEL_USE_CASE_IMAGE_CLASSIFICATION = 1;
  MODEL_USE_CASE_IMAGE_EDITING = 2;
  MODEL_USE_CASE_IMAGE_GENERATION = 3;
  MODEL_USE_CASE_SUPER_RESOLUTION = 4;
  MODEL_USE_CASE_SEMANTIC_SEGMENTATION = 5;
  MODEL_USE_CASE_DEPTH_ESTIMATION = 6;
  MODEL_USE_CASE_GAZE_ESTIMATION = 7;

  // E.g. OCR, image caption
  MODEL_USE_CASE_IMAGE_TO_TEXT = 8;
  MODEL_USE_CASE_OBJECT_DETECTION = 9;
  MODEL_USE_CASE_POSE_ESTIMATION = 10;
  MODEL_USE_CASE_DRIVER_ASSISTANCE = 11;
  MODEL_USE_CASE_ROBOTICS = 12;

  // Audio
  MODEL_USE_CASE_SPEECH_RECOGNITION = 13;
  MODEL_USE_CASE_AUDIO_ENHANCEMENT = 14;
  MODEL_USE_CASE_AUDIO_CLASSIFICATION = 15;
  MODEL_USE_CASE_AUDIO_GENERATION = 16;
  MODEL_USE_CASE_VOICE_ACTIVITY_DETECTION = 21;
  MODEL_USE_CASE_SPEAKER_DIARIZATION = 22;

  // Video
  MODEL_USE_CASE_VIDEO_CLASSIFICATION = 17;
  MODEL_USE_CASE_VIDEO_GENERATION = 18;
  MODEL_USE_CASE_VIDEO_OBJECT_TRACKING = 19;

  // LLM
  MODEL_USE_CASE_TEXT_GENERATION = 20;
}

// Everything known about a model: how it is presented, how it is built and
// exported, and which precision / runtime paths it supports.
//
// Field numbers are stable and not in declaration order; fields are grouped by
// topic below. Fields at their default may be omitted when authoring a model's
// config, but released info always fills in every field.
message ModelManifest {

  string aihm_version = 1;

  // ---------------------------------------------------------------------------
  // Identity
  // ---------------------------------------------------------------------------
  // Name of the model's folder within the repo.
  string id = 2;

  // Name of the model as it will appear on the website.
  // Should have dashes instead of underscores and all
  // words capitalized. For example, `Whisper-Base-En`.
  string name = 3;

  // ---------------------------------------------------------------------------
  // Description & categorization
  // ---------------------------------------------------------------------------

  // A brief catchy headline explaining what the model does and why it may be interesting.
  string headline = 6;

  // The domain the model is used in such as computer vision, audio, etc.
  ModelDomain domain = 7;

  // A 2-3 sentence description of how the model can be used.
  string description = 8;

  // What task the model is used to solve, such as object detection, classification, etc.
  ModelUseCase use_case = 9;

  // A list of applicable tags to add to the model.
  repeated ModelTag tags = 10;

  // A list of device types for which this model could be useful.
  // If unsure what to put here, default to Phone and Tablet.
  repeated FormFactor form_factors = 13;

  // ---------------------------------------------------------------------------
  // Metadata
  // ---------------------------------------------------------------------------

  // A list of a few technical details about the model.
  //   Model checkpoint: The name of the downloaded model checkpoint file.
  //   Input resolution: The size of the model's input. For example, `2048x1024`.
  //   Number of parameters: The number of parameters in the model.
  //   Model size: The file size of the downloaded model asset.
  //   Number of output classes: The number of classes the model can classify or annotate.
  repeated TechnicalDetail technical_details = 14;

  // Technical details that only apply to specific runtimes, e.g. a model size
  // that differs per runtime. One entry per runtime that has such details.
  repeated RuntimeTechnicalDetails runtime_technical_details = 32;

  // The license type of the original model repo.
  ModelLicense license_type = 15;

  // A list of datasets for which the model has pre-trained checkpoints
  // available as options in `model.py`. Typically only has one entry.
  repeated string dataset = 17;

  // ---------------------------------------------------------------------------
  // References
  // ---------------------------------------------------------------------------

  // Link to the research paper where the model was first published. Usually an arxiv link.
  optional string research_paper = 18;

  // The title of the research paper.
  optional string research_paper_title = 19;

  // A link to the original github repo with the model's code.
  optional string source_repo = 20;

  // A link to the model's license. Most commonly found in the github repo it was cloned from.
  optional string license_url = 21;

  // ---------------------------------------------------------------------------
  // Distribution & integrations
  // ---------------------------------------------------------------------------

  // If set, model assets shouldn't be distributed.
  bool restrict_model_sharing = 26;

  // Which Qualcomm Voice AI SDK variant the model is compatible with.
  // Unset means the model has no Voice AI SDK integration.
  VoiceAISdk voice_ai_sdk = 33;

  // ---------------------------------------------------------------------------
  // LLM-specific
  // ---------------------------------------------------------------------------

  // Whether it is a large language model (LLM) or not.
  bool model_type_llm = 28;

  // ---------------------------------------------------------------------------
  // Dependencies
  // ---------------------------------------------------------------------------

  // Names of other templates/ folders this model depends on.
  repeated string templates = 34;

  // Names of datasets/ folders this model depends on.
  repeated string datasets = 35;

  // Direct dependencies on other model folders under qai_hub_models/models/.
  repeated string models = 37;

  // External repository dependencies, imported as external_repos.<name>.
  repeated ExternalRepo external_repos = 36;

  // pip commands to run before / after `pip install -r requirements.txt`.
  repeated PipCommand pre_pip_install_commands = 50;
  repeated PipCommand post_pip_install_commands = 51;

  // Instructions for installing system-level dependencies before pip install.
  optional string readme_install_system_deps = 62;

  // Supported python versions: >= greater_than_or_equal_to, < less_than.
  // Each bound requires its reason.
  optional string python_version_greater_than_or_equal_to = 56;
  optional string python_version_greater_than_or_equal_to_reason = 57;
  optional string python_version_less_than = 58;
  optional string python_version_less_than_reason = 59;

  // ---------------------------------------------------------------------------
  // Model structure
  // ---------------------------------------------------------------------------

  // True for collection models made of components (e.g. encoder + decoder).
  bool is_collection_model = 45;

  // If set, the model returns multiple (input_spec, graph_name) pairs that are
  // compiled separately and linked into a single context binary.
  bool has_multi_graph = 60;

  // Whether the model uses the pre-compiled pattern.
  bool is_precompiled = 46;

  // ---------------------------------------------------------------------------
  // Precision & runtime support
  // ---------------------------------------------------------------------------

  // Precisions enabled via the CLI and run by scorecard. Always populated in
  // released info; an empty list in a source file means [float].
  repeated Precision supported_precisions = 39;

  // Runtimes that need extra orchestration steps beyond running the model.
  repeated Runtime orchestrator_runtimes = 48;

  // If set, only runtimes in orchestrator_runtimes are supported.
  bool only_allow_orchestrator_runtimes = 49;

  // If set, only AOT-prepared (context binary) paths are enabled.
  bool requires_aot_prepare = 47;

  // Precision + runtime paths that are disabled, with the reason.
  repeated DisabledPath disabled_paths = 42;

  // ---------------------------------------------------------------------------
  // Quantization & export
  // ---------------------------------------------------------------------------

  // Whether the model is quantized with aimet.
  bool is_aimet = 38;

  // Number of calibration samples used to speed up compilation (aimet models).
  optional int32 num_calibration_samples = 40;

  // If set, the model has a separate quantize.py script.
  bool separate_quantize_script = 61;

  // Default device for `qai-hub-models export`.
  string default_device = 43;

  // Whether the model's demo supports `--eval-mode on-device`.
  bool has_on_target_demo = 41;

  // ---------------------------------------------------------------------------
  // Validation
  // ---------------------------------------------------------------------------

  // Expected accuracy benchmark. If set, scorecard will flag results that
  // deviate from this value by more than the metric's metric_enablement_threshold.
  optional NumericsAccuracyBenchmark numerics_benchmark = 27;

  // Comma separated metrics printed in the export inference summary.
  string inference_metrics = 52;

  // Output index -> reason its PSNR should not be printed by export.
  map<int32, string> outputs_to_skip_validation = 44;

  // ---------------------------------------------------------------------------
  // README
  // ---------------------------------------------------------------------------

  // Extra README content for the model.
  string additional_readme_section = 53;

  // If set, omits "Example Usage" from the HuggingFace readme.
  bool skip_example_usage = 54;

  // If set, the README groups Setup / Demo / Export under one "## Export".
  bool local_device_deployment = 55;

  // ---------------------------------------------------------------------------
  // Internal
  // ---------------------------------------------------------------------------

  // Fields sourced from internal-config.yaml. Only set in the internal manifest
  // published to the private bucket; unset in public releases.
  optional Internal _internal = 63;

  // ---------------------------------------------------------------------------
  // Reserved (removed fields)
  // ---------------------------------------------------------------------------

  reserved 4;   reserved "status";
  reserved 5;   reserved "status_reason";
  reserved 11;  reserved "applicable_scenarios";
  reserved 12;  reserved "related_models";
  reserved 16;  reserved "model_maker_id";
  reserved 22;  reserved "has_static_banner";
  reserved 23;  reserved "has_animated_banner";
  reserved 24;  // Name unknown; reserved before this block existed.
  reserved 25;  reserved "imsdk_supported";
  reserved 29;  reserved "llm_details";
  reserved 30;  reserved "private_perf_form_factors";
  reserved 31;  reserved "voice_ai_compatible";

  message ExternalRepo {
    // Import name of the repo.
    string name = 1;
    string repo_url = 2;
    string commit_sha = 3;
    optional string patches_filename = 4;
  }

  message PipCommand {
    string command = 1;
    Machine machine = 2;

    // Which hosts the command runs on.
    enum Machine {
      // Runs on every host.
      MACHINE_UNSPECIFIED = 0;
      // Runs only when a CUDA GPU is detected.
      MACHINE_GPU = 1;
      // Runs only when no CUDA GPU is detected.
      MACHINE_CPU = 2;
    }
  }

  // Why a precision + runtime path is disabled.
  message DisabledPath {
    Precision precision = 1;
    Runtime runtime = 2;

    // Set by scorecard; removed automatically when the path works again.
    optional string scorecard_failure = 3;
    optional string scorecard_accuracy_failure = 4;

    // Link to an issue explaining the failure.
    optional string issue = 5;
    bool causes_timeout = 6;

    // If set, issue and causes_timeout only apply to these device names.
    repeated string disable_devices = 7;
  }

  message TechnicalDetail {
    string key = 1;

    oneof value {
      string string_value = 2;
      int64 int_value = 3;
      double float_value = 4;
    }
  }

  // A group of technical details that apply only to a particular runtime.
  message RuntimeTechnicalDetails {
    Runtime runtime = 1;
    repeated TechnicalDetail technical_details = 2;
  }

  // Fields sourced from internal-config.yaml.
  message Internal {
    // Whether or not the model is published on the website.
    // This should be set to public unless the model has poor accuracy/perf.
    ModelStatus status = 1;

    // If status is private, this must have a reference to an issue with an explanation.
    optional string status_reason = 2;

    // A list of real-world applications for which this model could be used.
    // This is free-form and almost anything reasonable here is fine.
    repeated string applicable_scenarios = 3;

    // A list of other similar models in the repo.
    // Typically, any model that performs the same task is fine.
    // If nothing fits, this can be left blank. Limit to 3 models.
    repeated string related_models = 4;

    // Some models are made by a company.
    optional string model_maker_id = 5;

    // Whether the model has a static image uploaded in S3. All published models must have this.
    bool has_static_banner = 6;

    // Whether the model has an animated asset uploaded in S3. This is optional.
    bool has_animated_banner = 7;

    // Whether the model is compatible with the IMSDK Plugin for IOT devices.
    bool imsdk_supported = 8;

    // Device form factors for which we don't publish performance data.
    repeated FormFactor private_perf_form_factors = 9;

    optional LLMDetails llm_details = 10;

    // Components benchmarked standalone, mapped to their model card tab label
    // (also the component's perf.yaml key).
    map<string, string> standalone_components = 11;

    // ---------------------------------------------------------------------------
    // CI / scorecard knobs
    // ---------------------------------------------------------------------------

    // If set, skips generating `test_generated.py`, the weekly scorecard, and perf.yaml.
    bool skip_hub_tests_and_scorecard = 12;

    // Second knob for skipping scorecard generation: skip scorecard but run hub tests.
    bool skip_scorecard = 13;

    // If set, scorecard still runs this model, but perf.yaml and associated
    // manifest.yaml / README.md changes are not written to disk.
    bool freeze_perf_yaml = 14;

    // Named CI test split this model runs in.
    TestSplit test_split = 15;

    // If set, skips all code generation for this model.
    bool skip_export = 16;

    // If set, omits the evaluate/accuracy tests from the generated test file.
    bool skip_evaluate = 17;

    // Overrides the scorecard acceptance threshold. E.g. 15 allows up to a
    // 15-point drop and is still considered successful.
    optional double numerics_threshold_override = 18;

    // Set when a model's requirements.txt versions can't match global_requirements.txt.
    bool global_requirements_incompatible = 19;

    // If true, this LLM is excluded from the weekly schedule and only runs when
    // explicitly requested via the 'llm_on_demand' token.
    bool on_demand_only = 20;

    enum ModelStatus {
      MODEL_STATUS_UNSPECIFIED = 0;
      MODEL_STATUS_PUBLISHED = 1;
      MODEL_STATUS_UNPUBLISHED = 2;
      // Pending models are waiting for scorecard to collect perf data before being published.
      MODEL_STATUS_PENDING = 3;
    }

    enum TestSplit {
      TEST_SPLIT_DEFAULT = 0;
      TEST_SPLIT_LLM = 1;
      TEST_SPLIT_PI05 = 2;
    }

    message LLMDetails {
      CallToAction call_to_action = 1;

      // Genie (QNN context binary) support
      bool genie_compatible = 2;

      // GenieX Llama.cpp (GGUF) support
      bool geniex_llamacpp_compatible = 3;

      reserved 4;

      enum CallToAction {
        CALL_TO_ACTION_UNSPECIFIED = 0;
        CALL_TO_ACTION_DOWNLOAD = 1;
        CALL_TO_ACTION_VIEW_README = 2;
        CALL_TO_ACTION_DOWNLOAD_AND_VIEW_README = 3;
        CALL_TO_ACTION_CONTACT_FOR_PURCHASE = 4;
        CALL_TO_ACTION_CONTACT_FOR_DOWNLOAD = 5;
        CALL_TO_ACTION_COMING_SOON = 6;
        CALL_TO_ACTION_CONTACT_US = 7;
      }
    }
  }
}
