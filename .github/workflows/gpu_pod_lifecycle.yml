name: GPU Pod Lifecycle

on:
  workflow_call:
    inputs:
      is_gpu_weekly:
        type: boolean
        default: false
      is_gpu_nightly:
        type: boolean
        default: false
      is_test_models:
        type: boolean
        default: false
      is_grader:
        description: Run the LLM response grader against artifacts uploaded by a prior llm_perf_collection run.
        type: boolean
        default: false
      grader_artifacts_run_id:
        description: Workflow run id whose `llm-perf-results-*` artifacts the grader should pull. Defaults to the current run.
        type: string
        default: ''

      force_kube:
        description: Force routing through the mlops-ci-gpu-xlarge runner group even if a -gpulv runner is online. Use to keep multiple parallel callers (e.g. nightly's 4 python versions) from queueing on a single GPU node.
        type: boolean
        default: false

      deployment:
        type: string
        default: prod
      models:
        type: string
        default: all
      test_devices:
        type: string
        default: default
      test_runtimes:
        type: string
        default: default
      test_precisions:
        type: string
        default: default
      options:
        type: string
        default: ''
      test_scope:
        type: string
        default: perf
      ignore_job_cache:
        type: boolean
        default: true
      ignore_known_failures:
        type: boolean
        default: true
      split_name:
        type: string
        default: ''
      sync_assets_branch:
        type: string
        default: ''
      python_version:
        type: string
        required: false
        default: ''
      disable_override_workbench_job_timeout:
        type: boolean
        default: false
      run_nightly_tests:
        description: Also collect tests marked @pytest.mark.nightly (in addition to unmarked + compile).
        type: boolean
        default: false
      use_per_model_venv:
        description: Install each model into a fresh venv rather than the fused global_requirements.txt venv. Set true for nightly to catch manifest-completeness bugs.
        type: boolean
        default: false

env:
  VENV_PATH: build/ci-envs/qaihm-build
  QAIHM_CI: 1

defaults:
  run:
    shell: bash

jobs:
  check_gpu_node:
    name: "Check GPU Node Availability"
    runs-on: [tetra-ubuntu-2204, self-hosted]
    outputs:
      use_kube: ${{ inputs.force_kube && 'true' || steps.check.outputs.use_kube }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        if: ${{ !inputs.force_kube }}
        uses: ./.github/actions/check-gpu-node
        with:
          pat-token: ${{ secrets.KUBE_GH_TOKEN }}

  run_test_models:
    name: "Run test_models"
    needs: check_gpu_node
    if: ${{ !cancelled() && inputs.is_test_models && needs.check_gpu_node.result == 'success' }}
    permissions:
      contents: read
      id-token: write
      packages: read
    secrets: inherit
    uses: ./.github/workflows/test_models.yml
    with:
      deployment: ${{ inputs.deployment }}
      models: ${{ inputs.models }}
      test_devices: ${{ inputs.test_devices }}
      test_runtimes: ${{ inputs.test_runtimes }}
      test_precisions: ${{ inputs.test_precisions }}
      options: ${{ inputs.options }}
      test_scope: ${{ inputs.test_scope }}
      ignore_job_cache: ${{ inputs.ignore_job_cache }}
      ignore_known_failures: ${{ inputs.ignore_known_failures }}
      split_name: ${{ inputs.split_name }}
      runs_on: ${{ needs.check_gpu_node.outputs.use_kube == 'true' && toJson(fromJson('["mlops-ci-gpu-xlarge"]')) || toJson(fromJson('{"group":"GPU"}')) }}
      is_gpu_node: ${{ needs.check_gpu_node.result == 'success' && needs.check_gpu_node.outputs.use_kube == 'false' }}
      sync_assets_branch: ${{ inputs.sync_assets_branch }}
      python_version: ${{ inputs.python_version }}
      disable_override_workbench_job_timeout: ${{ inputs.disable_override_workbench_job_timeout }}
      run_nightly_tests: ${{ inputs.run_nightly_tests }}
      use_per_model_venv: ${{ inputs.use_per_model_venv }}

  run_gpu_tests:
    name: "Run GPU Tests"
    needs: check_gpu_node
    if: ${{ !cancelled() && (inputs.is_gpu_weekly || inputs.is_gpu_nightly) && needs.check_gpu_node.result == 'success' }}
    runs-on: ${{ needs.check_gpu_node.outputs.use_kube == 'true' && fromJson('["mlops-ci-gpu-xlarge"]') || fromJson('{"group":"GPU"}') }}
    container: ${{ needs.check_gpu_node.outputs.use_kube == 'false' && fromJson('{"image":"docker-registry.qualcomm.com/library/nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04","options":"--gpus all -v /local:/local"}') || null }}
    timeout-minutes: 5760
    permissions:
      id-token: write
      packages: read
      contents: read
    env:
      TEST_SUITE: ${{ inputs.is_gpu_nightly && 'nightly' || 'weekly' }}
      HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      QDC_API_TOKEN: ${{ secrets.QDC_API_KEY }}
      QDC_PRIVATE_API_KEY: ${{ secrets.QDC_PRIVATE_API_KEY }}
      QAIHM_JUNIT_XML_PATH: ${{ github.workspace }}/test-results/models-junit.xml
      QAIHM_TEST_MODELS: ${{ inputs.models }}
    steps:
    - name: Setup user and environment (GPU node only)
      if: ${{ needs.check_gpu_node.outputs.use_kube == 'false' }}
      env:
        DOCKER_USER_ID: 4552456
        DOCKER_GROUP_ID: 200
      run: |
        groupadd -g $DOCKER_GROUP_ID qaihm_bot_group || true
        useradd -m -u $DOCKER_USER_ID -g $DOCKER_GROUP_ID -d /home/qaihm_bot -s /bin/bash qaihm_bot || true
        echo "HOME=/local/mnt2/workspace2/qaihm_bot" >> $GITHUB_ENV
        echo "TMPDIR=/local/mnt2/workspace2/qaihm_bot/tmp" >> $GITHUB_ENV
        echo "CUDA_VISIBLE_DEVICES=7" >> $GITHUB_ENV
        mkdir -p /local/mnt2/workspace2/qaihm_bot/tmp
        chown $DOCKER_USER_ID:$DOCKER_GROUP_ID /local/mnt2/workspace2/qaihm_bot/tmp

    - name: Setup environment (mlops-ci-gpu-xlarge only)
      if: ${{ needs.check_gpu_node.outputs.use_kube == 'true' }}
      run: |
        # /scratch is the 256 GB volume; the root overlay fills first.
        mkdir -p /scratch/qaihm/tmp /scratch/qaihm/.cache/huggingface
        echo "HOME=/scratch/qaihm" >> $GITHUB_ENV
        echo "TMPDIR=/scratch/qaihm/tmp" >> $GITHUB_ENV
        echo "HF_HOME=/scratch/qaihm/.cache/huggingface" >> $GITHUB_ENV
        echo "QAIHM_STORE_ROOT=/scratch/qaihm" >> $GITHUB_ENV

    - name: Install git
      run: |
        if ! command -v git &>/dev/null; then
          if [ "$(id -u)" -eq 0 ]; then
            apt-get update -qq
            apt-get install -y -qq git
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq git
          fi
        fi

    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install system dependencies
      env:
        # GPU LLM path is pinned to 3.12; callers don't pass python_version here.
        QAIHM_POD_PYTHON_VERSION: '3.12'
      run: bash src/qai_hub_models/scripts/kube/setup_pod.sh

    - name: CI Setup
      uses: ./.github/actions/ci-setup
      with:
        python-version: USE_EXISTING_INSTALL
        venv-path: ${{ env.VENV_PATH }}
        hub-deployments: ${{ inputs.deployment }}
        hub-user-token-prod: ${{ secrets.HUB_USER_TOKEN_PROD }}
        hub-user-token-staging: ${{ secrets.HUB_USER_TOKEN_STAGING }}
        hub-user-token-dev: ${{ secrets.HUB_USER_TOKEN_DEV }}
        hub-user-token-sandbox: ${{ secrets.HUB_USER_TOKEN_SANDBOX }}

    - name: Download QDC wheel
      run: |
        python3 scripts/build_and_test.py \
          --venv="${{ env.VENV_PATH }}" \
          --python="$(which python3)" \
          download_qdc_wheel --only

    - name: Install QDC
      run: |
        source ${{ env.VENV_PATH }}/bin/activate
        pip install qualcomm_device_cloud_sdk-*.whl
        pip uninstall -y onnxruntime

    - name: Install LLM response grader venv
      run: |
        cd $GITHUB_WORKSPACE
        python3 scripts/build_and_test.py \
          --venv="$HOME/qaihm-dev-grader" \
          install_llm_grader_requirements

    - name: Install model specific dependencies and run tests
      run: |
        cd $GITHUB_WORKSPACE && \
          python3 scripts/build_and_test.py \
              --venv="${{ env.VENV_PATH }}" \
              "test_gpu_models_${{ env.TEST_SUITE }}"

    - name: Generate Test Failure Summary
      if: always()
      run: |
        source "${{ env.VENV_PATH }}/bin/activate"
        pip install six
        python3 scripts/build_and_test.py --venv="${{ env.VENV_PATH }}" generate_test_summary

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: ${{ github.workspace }}/test-results

    - name: Upload CSV Results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pytest-results
        path: ${{ github.workspace }}/*.csv

    - name: Add CSV to GitHub summary
      if: always()
      run: |
        source "${{ env.VENV_PATH }}/bin/activate"
        python -c 'import os, pandas as pd; print("## 🧪 Evaluate Results"); fn="test_evaluate.csv"; print(pd.read_csv(fn).to_markdown(index=False)) if os.path.exists(fn) else print(f"File {fn} not found.")' >> "$GITHUB_STEP_SUMMARY"
        python -c 'import os, pandas as pd; print("## 🖥️ On-device Results"); fn="test_perf_on_device.csv"; print(pd.read_csv(fn).to_markdown(index=False)) if os.path.exists(fn) else print(f"File {fn} not found.")' >> "$GITHUB_STEP_SUMMARY"

    - name: Restore workspace ownership (GPU node only)
      # The container ran as root; hand the workspace back to the
      # unprivileged runner user so the next host-side job can unlink files.
      if: ${{ always() && needs.check_gpu_node.outputs.use_kube == 'false' }}
      run: |
        chown -R 4552456:200 "$GITHUB_WORKSPACE" || true

  run_grader:
    name: "Grade LLM Responses"
    needs: check_gpu_node
    if: ${{ !cancelled() && inputs.is_grader && needs.check_gpu_node.result == 'success' }}
    runs-on: ${{ needs.check_gpu_node.outputs.use_kube == 'true' && fromJson('["mlops-ci-gpu-xlarge"]') || fromJson('{"group":"GPU"}') }}
    container: ${{ needs.check_gpu_node.outputs.use_kube == 'false' && fromJson('{"image":"docker-registry.qualcomm.com/library/nvidia/cuda:12.6.3-cudnn-devel-ubuntu22.04","options":"--gpus all -v /local:/local"}') || null }}
    timeout-minutes: 720
    permissions:
      id-token: write
      packages: read
      contents: read
      actions: read
    env:
      HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      GRADER_VENV: ${{ github.workspace }}/grader_env
      GRADER_INPUT_DIR: ${{ github.workspace }}/llm-perf-results
    steps:
    - name: Setup environment (mlops-ci-gpu-xlarge only)
      if: ${{ needs.check_gpu_node.outputs.use_kube == 'true' }}
      run: |
        mkdir -p /scratch/qaihm/tmp /scratch/qaihm/.cache/huggingface
        echo "HOME=/scratch/qaihm" >> $GITHUB_ENV
        echo "TMPDIR=/scratch/qaihm/tmp" >> $GITHUB_ENV
        echo "HF_HOME=/scratch/qaihm/.cache/huggingface" >> $GITHUB_ENV
        echo "QAIHM_STORE_ROOT=/scratch/qaihm" >> $GITHUB_ENV

    - name: Install git
      run: |
        if ! command -v git &>/dev/null; then
          if [ "$(id -u)" -eq 0 ]; then
            apt-get update -qq
            apt-get install -y -qq git
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq git
          fi
        fi

    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Install system dependencies
      env:
        # GPU LLM path is pinned to 3.12; callers don't pass python_version here.
        QAIHM_POD_PYTHON_VERSION: '3.12'
      run: bash src/qai_hub_models/scripts/kube/setup_pod.sh

    - name: CI Setup
      uses: ./.github/actions/ci-setup
      with:
        python-version: USE_EXISTING_INSTALL
        venv-path: ${{ env.VENV_PATH }}
        hub-deployments: ${{ inputs.deployment }}
        hub-user-token-prod: ${{ secrets.HUB_USER_TOKEN_PROD }}
        hub-user-token-staging: ${{ secrets.HUB_USER_TOKEN_STAGING }}
        hub-user-token-dev: ${{ secrets.HUB_USER_TOKEN_DEV }}
        hub-user-token-sandbox: ${{ secrets.HUB_USER_TOKEN_SANDBOX }}

    - name: Download eval JSON artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: llm-perf-results-${{ inputs.split_name != '' && inputs.split_name || 'genie' }}-*
        merge-multiple: true
        path: ${{ env.GRADER_INPUT_DIR }}
        run-id: ${{ inputs.grader_artifacts_run_id != '' && inputs.grader_artifacts_run_id || github.run_id }}
        github-token: ${{ github.token }}

    - name: Install grader venv
      run: |
        python3 scripts/build_and_test.py \
          --venv="$GRADER_VENV" \
          install_llm_grader_requirements

    - name: Grade LLM responses
      id: grade_responses
      env:
        QAIHM_GRADE_RESPONSES_DIR: ${{ env.GRADER_INPUT_DIR }}
      run: |
        python3 scripts/build_and_test.py \
          --venv="$GRADER_VENV" \
          grade_llm_responses

    # Ahead of the summary step: this resolves each model's manifest baseline
    # into the grade files, which is where the summary reads the ref score from.
    - name: Collect LLM Accuracy CSV
      if: ${{ !cancelled() && steps.grade_responses.outcome == 'success' }}
      env:
        QAIHM_TEST_ARTIFACTS_DIR: ${{ github.workspace }}/qaihm_test_artifacts
        QAIHM_GRADE_RESPONSES_DIR: ${{ env.GRADER_INPUT_DIR }}
      run: |
        python3 scripts/build_and_test.py \
          --venv="${{ env.VENV_PATH }}" \
          collect_llm_accuracy_csv

    - name: Add grader scores to GitHub summary
      if: ${{ !cancelled() && steps.grade_responses.outcome == 'success' }}
      run: |
        python3 scripts/ci/grader_summary.py "$GRADER_INPUT_DIR" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Accuracy CSV
      if: ${{ !cancelled() && steps.grade_responses.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        # Canonical name (run_id = parent scorecard run) so the collector's accuracy glob picks this up; the split_name suffix keeps it a distinct per-split artifact (defaults to "genie" for the genie collection).
        name: Scorecard Cached Artifact (accuracy.csv, ${{ github.run_id }}, ${{ inputs.split_name != '' && inputs.split_name || 'genie' }})
        path: ${{ github.workspace }}/qaihm_test_artifacts/accuracy.csv
        if-no-files-found: ignore

    - name: Upload graded results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: Grace2 Results (${{ inputs.split_name != '' && inputs.split_name || 'genie' }})
        path: ${{ env.GRADER_INPUT_DIR }}
