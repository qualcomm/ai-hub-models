name: QAI Hub Models Scorecard

on:
    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:
      inputs:
        deployment:
          description: Hub Deployment
          default: prod
          type: string

        models:
          description: Test Models. Model names match folder names in `src/qai_hub_models/models`. Comma Separated.
          required: false
          type: string
          default: pytorch_no_llm

        test_devices:
          description: Test Devices. See `src/qai_hub_models/scorecard/device.py`. Comma Separated.
          type: string
          default: default

        test_runtimes:
          description: Test Paths (runtimes). See `src/qai_hub_models/scorecard/path_profile.py`. Comma Separated.
          type: string
          default: default

        test_precisions:
          description: Test Precisions (float, w8a8, etc.)
          required: false
          type: string
          default: default

        options:
          description: 'Comma-separated scorecard options (e.g. "qairt_version=2.45,geniex_version=0.3.7,checkpoint=<private-bucket key>"; checkpoint needs models to name one model). See scripts/ci/parse_options.py for the full key list.'
          required: false
          type: string
          default: ''

        delay:
          description: Result Collection Time Delay
          required: true
          default: scorecard_collection_immediate
          type: choice
          options:
            - scorecard_collection_32h_delay
            - scorecard_collection_8h_delay
            - scorecard_collection_immediate

        test_scope:
          description: Test Scope
          default: perf
          type: choice
          options:
            - compile_only
            - perf
            - perf_and_accuracy

        release_scope:
          description: Release Scope
          default: none
          type: choice
          options:
            - none
            - create_pr
            - upload_export_assets
            - upload_export_assets_and_create_pr

        ignore_job_cache:
          description: Force run inference jobs for compiled models that haven't changed since the last scorecard run (only applicable on PROD deployment)
          default: false
          type: boolean


    workflow_call:
      inputs:
        deployment:
          default: prod
          type: string

        test_devices:
          default: all
          type: string

        test_runtimes:
          default: default
          type: string

        test_precisions:
          default: default
          type: string

        options:
          description: 'Comma-separated scorecard options (e.g. "qairt_version=2.45,geniex_version=0.3.7,checkpoint=<private-bucket key>"; checkpoint needs models to name one model). See scripts/ci/parse_options.py.'
          type: string
          default: ''

        models:
          type: string
          default: all

        delay:
          type: string
          default: scorecard_collection_8h_delay

        test_scope:
          description: Test Scope
          type: string
          default: perf

        release_scope:
          default: none
          type: string

        ignore_job_cache:
          default: true
          type: boolean

        tableau_branch_name:
          default: ''
          type: string

        notify_failures:
          description: Notify Slack of the results
          default: false
          type: boolean

        generate_test_summary:
          description: Generate a combined test summary
          default: true
          type: boolean

env:
  PYTHONUNBUFFERED: 1
  QAIHM_CI: 1
  VENV_PATH: build/ci-envs/qaihm-build
  CMAKE_ARGS: -DCMAKE_POLICY_VERSION_MINIMUM=3.5

jobs:
  wait_workbench_deployment:
    name: Wait For Workbench to Finish Deploying
    runs-on: aihub-models-ubuntu-2404-ec2
    timeout-minutes: 180
    env:
      QAIHM_TEST_DEPLOYMENT: ${{ inputs.deployment }}
    steps:
    - uses: actions/checkout@v7

    - name: CI Setup
      uses: ./.github/actions/ci-setup
      with:
        venv-path: ${{ env.VENV_PATH }}
        hub-deployments: ${{ env.QAIHM_TEST_DEPLOYMENT }},prod
        hub-user-token-prod: ${{ secrets.HUB_USER_TOKEN_PROD }}
        hub-user-token-staging: ${{ secrets.HUB_USER_TOKEN_STAGING }}
        hub-user-token-dev: ${{ secrets.HUB_USER_TOKEN_DEV }}
        hub-user-token-sandbox: ${{ secrets.HUB_USER_TOKEN_SANDBOX }}

    - name: Wait for workbench
      uses: ./.github/actions/wait-workbench-deployment
      with:
        venv-path: ${{ env.VENV_PATH }}

  sync_assets:
    name: Sync Static Model Assets
    needs: wait_workbench_deployment
    secrets: inherit
    uses: ./.github/workflows/scorecard_sync_static_assets.yml
    with:
      models: ${{ inputs.models }}
      deployments: ${{ inputs.deployment }}
      create_pr: ${{ !contains(inputs.deployment, '.sandbox') }}

  submit_split_jobs:
    name: Submit Workbench Jobs
    needs: [wait_workbench_deployment, sync_assets]
    if: ${{ !cancelled() && needs.wait_workbench_deployment.result == 'success' && (needs.sync_assets.result == 'success' || needs.sync_assets.result == 'skipped') }}
    secrets: inherit
    uses: ./.github/workflows/test_models_split.yml
    with:
      deployment: ${{ inputs.deployment }}
      models: ${{ inputs.models }}
      test_devices: ${{ inputs.test_devices }}
      test_runtimes: ${{ inputs.test_runtimes }}
      test_precisions: ${{ inputs.test_precisions }}
      options: ${{ inputs.options }}
      test_scope: ${{ inputs.test_scope }}
      ignore_job_cache: ${{ inputs.ignore_job_cache }}
      sync_assets_branch: ${{ needs.sync_assets.outputs.branch_name }}
      max_models_per_split: ${{ inputs.test_scope == 'perf_and_accuracy' && 30 || 60 }}
      max_num_splits: 8
      disable_override_workbench_job_timeout: true
      use_run_scorecard: true

  fix_flaky_jobs:
    name: "Phase 2: Fix Flaky Inference Jobs"
    needs: submit_split_jobs
    if: ${{ !cancelled() && needs.submit_split_jobs.result != 'skipped' }}
    secrets: inherit
    uses: ./.github/workflows/scorecard_fix_flaky_jobs.yml
    with:
      action_id: ${{ github.run_id }}
      delay: ${{ inputs.delay }}
      deployment: ${{ inputs.deployment }}
      test_mode: false

  # Same splits on a (possibly different) machine, after the flaky inference
  # jobs are fixed: release asset upload (when requested) and on-device accuracy
  # from the fixed job IDs. Scopes without accuracy run only the upload, and only
  # when requested.
  accuracy_phase:
    name: "Phase 3: ${{ inputs.test_scope == 'perf_and_accuracy' && 'On-Device Accuracy' || 'Upload Release Assets' }} (${{ matrix.split.split_name }})"
    needs: [submit_split_jobs, sync_assets, fix_flaky_jobs]
    if: ${{ !cancelled() && needs.submit_split_jobs.result != 'skipped' && needs.submit_split_jobs.outputs.accuracy_matrix != '' && needs.submit_split_jobs.outputs.accuracy_matrix != '[]' && needs.fix_flaky_jobs.result != 'skipped' && (inputs.test_scope == 'perf_and_accuracy' || contains(inputs.release_scope, 'upload_export_assets')) }}
    permissions:
      contents: read
      id-token: write
      packages: read
      actions: read
    secrets: inherit
    strategy:
      matrix:
        split: ${{ fromJson(needs.submit_split_jobs.outputs.accuracy_matrix) }}
      fail-fast: false
    uses: ./.github/workflows/scorecard_run_split.yml
    with:
      deployment: ${{ inputs.deployment }}
      models: ${{ matrix.split.models }}
      test_devices: ${{ inputs.test_devices }}
      test_runtimes: ${{ inputs.test_runtimes }}
      test_precisions: ${{ inputs.test_precisions }}
      options: ${{ inputs.options }}
      test_scope: ${{ inputs.test_scope }}
      split_name: ${{ matrix.split.split_name }}
      runs_on: ${{ toJson(matrix.split.runs_on) }}
      sync_assets_branch: ${{ needs.sync_assets.outputs.branch_name }}
      disable_override_workbench_job_timeout: true
      phase: ${{ inputs.test_scope == 'perf_and_accuracy' && 'accuracy' || 'upload' }}
      s3_prefix: ${{ contains(inputs.release_scope, 'upload_export_assets') && 'pre_release_assets' || '' }}

  scorecard_llm_device_run:
    name: LLM On-Device Run (asset upload, perf, accuracy)
    needs: [wait_workbench_deployment, submit_split_jobs]
    # compile_only still runs this workflow when release_scope wants uploads; it
    # produces the LLM release-assets.yaml. Nested collect_llm_perf* jobs gate on
    # test_scope so on-device work stays skipped.
    if: ${{ !cancelled() && needs.submit_split_jobs.result != 'skipped' && (inputs.test_scope != 'compile_only' || contains(inputs.release_scope, 'upload_export_assets')) }}
    secrets: inherit
    uses: ./.github/workflows/scorecard_llm_device_run.yml
    with:
      action_id: ${{ github.run_id }}
      s3_prefix: ${{ contains(inputs.release_scope, 'upload_export_assets')
                     && 'pre_release_assets'
                     || 'ephemeral_test_assets' }}
      deployment: ${{ inputs.deployment }}
      device: ${{ inputs.test_devices }}
      test_precisions: ${{ inputs.test_precisions }}
      test_runtimes: ${{ inputs.test_runtimes }}
      test_scope: ${{ inputs.test_scope }}
      options: ${{ inputs.options }}

  collect_results:
    name: "Phase 4: Collect Scorecard Results"
    needs: [submit_split_jobs, fix_flaky_jobs, accuracy_phase, scorecard_llm_device_run]
    if: ${{ !cancelled() && needs.submit_split_jobs.result != 'skipped' }}
    secrets: inherit
    uses: ./.github/workflows/scorecard_collect_results.yml
    with:
      action_id: ${{ github.run_id }}
      notify_slack: ${{ inputs.notify_failures || false }}
      create_pr: ${{ contains(inputs.release_scope, 'create_pr') }}
      previous_results_branch: ${{ github.ref_name }}
      use_previous_results_branch_as_base: true
      publish_to_tableau: ${{ inputs.tableau_branch_name != '' }}
      tableau_branch_name: ${{ inputs.tableau_branch_name || '' }}
