name: Scorecard - LLM On-Device Run (Asset Upload, Perf, Accuracy)

on:
    workflow_call:
      inputs:
        action_id:
          type: string
          required: true

        s3_prefix:
          description: |
            S3 prefix for context-binary uploads. Empty disables S3 upload.
            "pre_release_assets" is canonical (kept forever); "ephemeral_test_assets"
            is auto-purged after 7 days via lifecycle rule.
          type: string
          default: ''

        deployment:
          description: Hub Deployment
          type: string
          default: prod

        device:
          description: |
            Target device(s) for LLM perf collection. Must match the devices
            built by the asset-upload step (which reads QAIHM_TEST_DEVICES from
            the scorecard environment.env). "all" or empty falls back to every
            LLM compile device.
          type: string
          default: 'all'

        test_precisions:
          description: |
            Test Precisions (float, w8a8, etc.)
          type: string
          default: 'default'

        test_runtimes:
          description: |
            Test Paths (runtimes). See `src/qai_hub_models/scorecard/path_profile.py`.
            For LLMs "default" resolves to "geniex_qairt,geniex_llamacpp".
          type: string
          default: 'default'

        test_scope:
          description: |
            Test scope: 'perf', 'accuracy', or 'perf_and_accuracy'. Controls
            whether the on-device accuracy evaluation (100 default prompts) runs.
          type: string
          default: perf

        options:
          description: 'Comma-separated scorecard options (e.g. "qairt_version=2.45,geniex_version=0.3.7"). qairt_version selects the QAIRT SDK downloaded on-device for genie / geniex_qairt; see scripts/ci/parse_options.py.'
          type: string
          default: ''

env:
  PYTHONUNBUFFERED: 1
  VENV_PATH: build/ci-envs/qaihm-build
  QAIHM_CI: 1

jobs:
  determine_llm_models:
    name: Determine LLM Models
    runs-on: [tetra-ubuntu-2204, self-hosted]
    outputs:
      models: ${{ steps.find.outputs.models }}
      llm_split_matrix: ${{ steps.find.outputs.llm_split_matrix }}
      has_models: ${{ steps.find.outputs.has_models }}
      geniex_version: ${{ steps.parse_versions.outputs.geniex_version }}
      qairt_version: ${{ steps.parse_versions.outputs.qairt_version }}
      genie_scope: ${{ steps.parse_versions.outputs.genie_scope }}
      eval_dataset: ${{ steps.parse_versions.outputs.eval_dataset }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse options
        id: parse_versions
        env:
          RAW: ${{ inputs.options }}
        run: python3 scripts/ci/parse_options.py

      - name: CI Setup
        uses: ./.github/actions/ci-setup
        with:
          sudo-password: ${{ secrets.TETRASERVICE_PASSWORD }}
          venv-path: ${{ env.VENV_PATH }}

      - name: Download Flaky-Job Artifacts
        uses: actions/download-artifact@v8
        with:
            run-id: ${{ inputs.action_id }}
            github-token: ${{ github.token }}
            name: Scorecard Cached Artifact (Flaky-Job-IDs, ${{ inputs.action_id }})
            path: build/scorecard-yamls/${{ inputs.action_id }}

      - name: Find Models in LLM Split
        id: find
        run: |
          source "${{ env.VENV_PATH }}/bin/activate"
          MODELS=$(grep '^QAIHM_TEST_MODELS=' build/scorecard-yamls/${{ inputs.action_id }}/environment.env | cut -d= -f2 | tr -cd 'A-Za-z0-9_,\-')
          python -m qai_hub_models.scripts.split_torch_models --models "$MODELS" --output-format llm-github-output >> "$GITHUB_OUTPUT"

  test_llm_export:
    name: LLM Asset Upload (${{ matrix.split.split_name }})
    needs: determine_llm_models
    if: ${{ needs.determine_llm_models.outputs.has_models == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        split: ${{ fromJson(needs.determine_llm_models.outputs.llm_split_matrix) }}
    secrets: inherit
    uses: ./.github/workflows/scorecard_test_export_scripts.yml
    with:
      action_id: ${{ inputs.action_id }}
      s3_prefix: ${{ inputs.s3_prefix }}
      models: ${{ matrix.split.models }}
      split_name: ${{ matrix.split.split_name }}
      runs_on: '["tetra-ubuntu-2204", "self-hosted"]'
      build_and_test_target: test_llm_export_scripts
      expect_post_flaky_artifact: false

  combine_llm_release_assets:
    name: Combine LLM Release Assets
    needs: [determine_llm_models, test_llm_export]
    # Do not require success here, since individual failures could block all
    # LLM runs.
    if: ${{ !cancelled() && needs.test_llm_export.result != 'skipped' }}
    outputs:
      fresh_asset_models: ${{ steps.check.outputs.fresh_asset_models }}
      missing_splits: ${{ steps.check.outputs.missing_splits }}
    runs-on: [tetra-ubuntu-2204, self-hosted]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: CI Setup
        uses: ./.github/actions/ci-setup
        with:
          sudo-password: ${{ secrets.TETRASERVICE_PASSWORD }}
          venv-path: ${{ env.VENV_PATH }}

      - name: Download per-split release assets
        # A failed shard uploads no artifact, so the pattern matching fewer
        # artifacts than there are shards is expected, not an error.
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: "Scorecard LLM Perf Release Assets (${{ inputs.action_id }}, llm*)"
          path: build/split-llm-release-assets

      - name: Combine
        run: |
          source "${{ env.VENV_PATH }}/bin/activate"
          python -m qai_hub_models.scripts.combine_split_artifacts \
            --input-dir build/split-llm-release-assets \
            --output-dir build/combined-llm-release-assets

      - name: Report shard coverage
        id: check
        env:
          LLM_SPLIT_MATRIX: ${{ needs.determine_llm_models.outputs.llm_split_matrix }}
        run: |
          source "${{ env.VENV_PATH }}/bin/activate"
          python scripts/ci/check_llm_release_assets.py \
            --release-assets build/combined-llm-release-assets/release-assets.yaml \
            --downloaded-dir build/split-llm-release-assets

      - name: Upload combined LLM release assets
        uses: actions/upload-artifact@v7
        with:
          name: Scorecard LLM Perf Release Assets (${{ inputs.action_id }})
          path: build/combined-llm-release-assets/release-assets.yaml
          if-no-files-found: error

  collect_llm_perf:
    name: Collect LLM Performance Numbers (Genie)
    needs: [determine_llm_models, combine_llm_release_assets]
    # GENIE is opt-in only: the export sweep excludes it from 'default'
    # (path_profile.py::default_sweep_paths), so a 'default' run builds no genie
    # assets. Only collect Genie perf when 'genie' is named explicitly, else this
    # job fails with "No genie release asset found".
    if: ${{ !cancelled() && needs.combine_llm_release_assets.result == 'success' && inputs.s3_prefix != '' && inputs.test_scope != 'compile_only' && contains(format(',{0},', inputs.test_runtimes), ',genie,') }}
    secrets: inherit
    uses: ./.github/workflows/llm_perf_collection.yml
    with:
      model: ${{ needs.determine_llm_models.outputs.models }}
      # Genie compiles for every device but only runs on cs_x_elite. An explicit
      # device list (e.g. cs_8_elite) is still respected.
      device: ${{ (inputs.device == 'all' || inputs.device == 'default' || inputs.device == '') && 'cs_x_elite' || inputs.device }}
      # Map default and default variants to 'all' (see scorecard/envvars.py).
      precision: ${{ contains(fromJSON('["default", "default_minus_float", "default_quantized", "bench"]'), inputs.test_precisions) && 'all' || inputs.test_precisions }}
      deployment: ${{ inputs.deployment }}
      qairt_version: ${{ needs.determine_llm_models.outputs.qairt_version }}
      # options' genie_scope overrides test_scope for Genie only.
      run_eval: ${{ (needs.determine_llm_models.outputs.genie_scope || inputs.test_scope) != 'perf' }}
      eval_dataset: ${{ needs.determine_llm_models.outputs.eval_dataset }}
      create_pr: false
      release_assets_action_id: ${{ inputs.action_id }}

  collect_llm_perf_geniex:
    name: Collect LLM Performance Numbers (GenieX-QAIRT)
    needs: [determine_llm_models, combine_llm_release_assets]
    # GENIEX_QAIRT is in default_sweep_paths, so a 'default' token in
    # test_runtimes should enable it -- match on comma-tokens rather than a
    # string equality check so 'default,other-runtime' variants keep working.
    if: ${{ !cancelled() && needs.combine_llm_release_assets.result == 'success' && inputs.s3_prefix != '' && inputs.test_scope != 'compile_only' && (contains(format(',{0},', inputs.test_runtimes), ',default,') || contains(format(',{0},', inputs.test_runtimes), ',geniex_qairt,') || inputs.test_runtimes == '') }}
    secrets: inherit
    uses: ./.github/workflows/llm_perf_collection_geniex.yml
    with:
      model: ${{ needs.determine_llm_models.outputs.models }}
      device: ${{ inputs.device }}
      # Map default and default variants to 'all' (see scorecard/envvars.py).
      precision: ${{ contains(fromJSON('["default", "default_minus_float", "default_quantized", "bench"]'), inputs.test_precisions) && 'all' || inputs.test_precisions }}
      geniex_bench_plugin: qairt
      geniex_version: ${{ needs.determine_llm_models.outputs.geniex_version }}
      qairt_version: ${{ needs.determine_llm_models.outputs.qairt_version }}
      release_assets_action_id: ${{ inputs.action_id }}
      create_pr: false
      scope: ${{ inputs.test_scope }}
      eval_dataset: ${{ needs.determine_llm_models.outputs.eval_dataset }}

  collect_llm_perf_geniex_llamacpp:
    name: Collect LLM Performance Numbers (GenieX-llama.cpp)
    needs: [determine_llm_models, combine_llm_release_assets]
    # GENIEX_LLAMACPP is in default_sweep_paths, so a 'default' token in
    # test_runtimes enables it. Mirrors the qairt collector; the plugin
    # selection is the only difference.
    if: ${{ !cancelled() && needs.combine_llm_release_assets.result == 'success' && inputs.s3_prefix != '' && inputs.test_scope != 'compile_only' && (contains(format(',{0},', inputs.test_runtimes), ',default,') || contains(format(',{0},', inputs.test_runtimes), ',geniex_llamacpp,') || inputs.test_runtimes == '') }}
    secrets: inherit
    uses: ./.github/workflows/llm_perf_collection_geniex.yml
    with:
      model: ${{ needs.determine_llm_models.outputs.models }}
      device: ${{ inputs.device }}
      # Map default and default variants to 'all' (see scorecard/envvars.py).
      precision: ${{ contains(fromJSON('["default", "default_minus_float", "default_quantized", "bench"]'), inputs.test_precisions) && 'all' || inputs.test_precisions }}
      geniex_bench_plugin: llama_cpp
      geniex_version: ${{ needs.determine_llm_models.outputs.geniex_version }}
      release_assets_action_id: ${{ inputs.action_id }}
      create_pr: false
      scope: ${{ inputs.test_scope }}
      eval_dataset: ${{ needs.determine_llm_models.outputs.eval_dataset }}
