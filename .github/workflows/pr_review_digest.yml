name: Open PR Digest

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: America/Los_Angeles

  workflow_dispatch:
    inputs:
      channel_id:
        description: Slack channel ID to post to (default is the SLACK_CHANNEL_ID secret)
        type: string
        required: false
      notify_slack:
        description: Post the digest to Slack
        type: boolean
        default: true
      apply:
        description: Request reviewers and close stale PRs
        type: boolean
        default: false

jobs:
  digest:
    name: Open PR Digest
    runs-on: ubuntu-latest
    env:
      SLACK_CHANNEL: ${{ inputs.channel_id || secrets.SLACK_CHANNEL_ID }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src/qai_hub_models/scripts/pr_triage.py
            src/qai_hub_models/scripts/pr_triage_report.py
            src/qai_hub_models/scripts/pr_triage_types.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Build digest
        env:
          # Needs org team read access, which github.token lacks.
          GH_TOKEN: ${{ secrets.STAGING_GH_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == "true" ]]; then
            args+=(--apply)
          fi
          # Run by path: the scripts are stdlib-only plus the preinstalled `gh`.
          python3 src/qai_hub_models/scripts/pr_triage.py "${args[@]}" \
            --full-report-file "$RUNNER_TEMP/pr_digest_full.md" \
            --slack-message-file "$RUNNER_TEMP/slack_message.json"

      # Scheduled runs have no inputs (null, which an expression treats as false).
      - name: Build Slack payload
        if: github.event_name == 'schedule' || inputs.notify_slack
        run: |
          jq --arg channel "$SLACK_CHANNEL" '. + {channel: $channel}' \
            "$RUNNER_TEMP/slack_message.json" > "$RUNNER_TEMP/slack_payload.json"

      - name: Post summary to Slack
        if: github.event_name == 'schedule' || inputs.notify_slack
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_NOTIFIER_TOKEN }}
          payload-file-path: ${{ runner.temp }}/slack_payload.json

      - name: Upload full report to Slack
        if: github.event_name == 'schedule' || inputs.notify_slack
        uses: slackapi/slack-github-action@v4
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_NOTIFIER_TOKEN }}
          payload: |
            channel_id: "${{ env.SLACK_CHANNEL }}"
            initial_comment: "The above tables exclude PRs that have no action item for ML Tech. View the full report below."
            file: "${{ runner.temp }}/pr_digest_full.md"
            filename: "pr_digest_full.md"
