datasets:
- cocowholebody
description: LiteHRNet estimates human pose and returns a location and confidence for each of 17 joints. It expects an image containing a single person, pre-cropped and resized to the model's 256x192 input resolution. The reported performance covers pose estimation on that crop.
domain: MODEL_DOMAIN_COMPUTER_VISION
has_on_target_demo: true
headline: Human pose estimation.
id: litehrnet
license_type: MODEL_LICENSE_APACHE_2_0
license_url: https://github.com/HRNet/Lite-HRNet/blob/hrnet/LICENSE
name: LiteHRNet
numerics_benchmark:
  dataset_name: cocowholebody
  metric_name: Mean Average Precision
  source: AI Hub Models Reference Eval
  unit: mAP
  value: 58.0
pre_pip_install_commands:
- command: pip install mmpose==1.2.0 --no-deps
research_paper: https://arxiv.org/abs/2104.06403
research_paper_title: 'Lite-HRNet: A Lightweight High-Resolution Network'
source_repo: https://github.com/HRNet/Lite-HRNet
templates:
- corevision
- mmpose
use_case: MODEL_USE_CASE_POSE_ESTIMATION
