description: InternVL3.5 is a vision-language model from OpenGVLab capable of understanding both text and images for multimodal reasoning tasks such as visual question answering and image captioning.
domain: MODEL_DOMAIN_GENERATIVE_AI
has_multi_graph: true
headline: Multimodal 4B vision-language model for text and image understanding.
id: intern3_5_vl_4b
is_aimet: true
is_collection_model: true
license_type: MODEL_LICENSE_APACHE_2_0
license_url: https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/apache-2.0.md
model_type_llm: true
name: Intern3.5-VL-4B
numerics_benchmark:
  dataset_name: grace2
  metric_name: Grace2
  source: AI Hub Models Reference Eval
  unit: '%'
  value: 88.9
only_allow_orchestrator_runtimes: true
orchestrator_runtimes:
- RUNTIME_GENIEX_QAIRT
- RUNTIME_GENIE
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: MACHINE_GPU
- command: pip install --force-reinstall --no-deps onnxruntime-gpu==1.31.0
  machine: MACHINE_GPU
pre_pip_install_commands:
- command: pip install --force-reinstall torch==2.10.0+cu130 torchvision==0.25.0+cu130 --index-url https://download.pytorch.org/whl/cu130
  machine: MACHINE_GPU
python_version_greater_than_or_equal_to: '3.11'
python_version_greater_than_or_equal_to_reason: onnxruntime 1.31.0 has no Python 3.10 wheels
requires_aot_prepare: true
research_paper: https://arxiv.org/abs/2508.18265
research_paper_title: InternVL3.5 Advancing Open-Source Multimodal Models in Versatility, Reasoning, and Efficiency
runtime_technical_details:
- runtime: RUNTIME_GENIEX_QAIRT
  technical_details:
  - key: Context lengths
    string_value: 512, 1024, 2048, 4096
  - key: Input sequence length for Prompt Processor
    string_value: '128'
  - key: Minimum QNN SDK version required
    string_value: 2.45.0
  - key: Supported Input Modalities
    string_value: image, text
  - key: Supported Output Modalities
    string_value: text
  - key: model_infer_id
    string_value: ai-hub-models/InternVL3_5-4B
separate_quantize_script: true
