- PRECISION_W4A16
tags:
- MODEL_TAG_LLM
- MODEL_TAG_VLM
- MODEL_TAG_GENERATIVE_AI
technical_details:
- key: Model architecture
  string_value: Multimodal Transformer with InternViT Vision Encoder, Qwen-based Large Language Model (LLM) backend, Grouped Query Attention (GQA), and SwiGLU activation. It follows a ViT → MLP → LLM design for efficient vision-language understanding and reasoning.
- key: Response Rate
  string_value: Rate of response generation after the first response token.
- key: Supported languages
  string_value: No exact mention
