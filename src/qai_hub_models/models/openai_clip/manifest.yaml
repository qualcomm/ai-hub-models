description: Contrastive Language-Image Pre-Training (CLIP) uses a ViT like transformer to get visual features and a causal language model to get the text features. Both the text and visual features can then be used for a variety of zero-shot learning tasks.
domain: MODEL_DOMAIN_MULTIMODAL
has_on_target_demo: true
headline: Multi-modal foundational model for vision and language tasks like image/text similarity and for zero-shot image classification.
id: openai_clip
is_collection_model: true
license_type: MODEL_LICENSE_MIT
license_url: https://github.com/openai/CLIP/blob/main/LICENSE
name: OpenAI-Clip
numerics_benchmark:
  dataset_name: imagenet
  metric_name: Top-1 Accuracy
  source: https://arxiv.org/abs/2103.00020
  unit: '%'
  value: 68.6
post_pip_install_commands:
- command: pip install git+https://github.com/openai/CLIP.git@ded190a --use-pep517
research_paper: https://arxiv.org/abs/2103.00020
research_paper_title: Learning Transferable Visual Models From Natural Language Supervision
source_repo: https://github.com/openai/CLIP/
supported_precisions:
- PRECISION_FLOAT
- PRECISION_W8A16
tags:
- MODEL_TAG_FOUNDATION
technical_details:
- key: Image input resolution
  string_value: 224x224
- key: Model checkpoint
  string_value: ViT-B/16
- key: Model size (float)
  string_value: 571 MB
- key: Number of parameters
  string_value: 150M
- key: Text context length
  string_value: '77'
use_case: MODEL_USE_CASE_IMAGE_CLASSIFICATION
templates:
- corevision
- zeroshot_classifier
