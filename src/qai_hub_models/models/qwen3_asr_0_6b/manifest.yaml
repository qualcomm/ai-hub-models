description: Qwen3-ASR is a speech recognition model from the Qwen team, built on the audio understanding of Qwen3-Omni. It supports language identification and transcription for 30 languages and 22 Chinese dialects, and stays robust on noisy audio, singing voice, and songs with background music. The 0.6B version trades a small amount of accuracy for much higher throughput.
domain: Audio
headline: Multilingual 0.6B speech recognition model covering 30 languages and 22 Chinese dialects.
