description: Llama 3 is a family of LLMs. The model is quantized to w4 (4-bit weights) and part of the model is quantized to w8 (8-bit weights) making it suitable for on-device deployment.
domain: MODEL_DOMAIN_GENERATIVE_AI
has_multi_graph: true
headline: State-of-the-art large language model useful on a variety of language understanding and generation tasks.
id: llama_v3_2_1b_instruct
is_aimet: true
is_collection_model: true
license_type: MODEL_LICENSE_LLAMA3
license_url: https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct/blob/main/LICENSE.txt
local_device_deployment: true
model_type_llm: true
name: Llama-v3.2-1B-Instruct
numerics_benchmark:
  dataset_name: grace2
  metric_name: Grace2
  source: AI Hub Models Reference Eval
  unit: '%'
  value: 73.4
only_allow_orchestrator_runtimes: true
orchestrator_runtimes:
- RUNTIME_GENIEX_QAIRT
- RUNTIME_GENIE
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: MACHINE_GPU
- command: pip install --force-reinstall torch==2.10.0+cu130 torchvision==0.25.0+cu130 --index-url https://download.pytorch.org/whl/cu130
  machine: MACHINE_GPU
- command: pip install --force-reinstall --no-deps onnxruntime-gpu==1.31.0
  machine: MACHINE_GPU
requires_aot_prepare: true
research_paper: https://github.com/meta-llama/llama-models/blob/main/models/llama3_2/MODEL_CARD.md
research_paper_title: 'LLaMA: Open and Efficient Foundation Language Models'
restrict_model_sharing: true
runtime_technical_details:
- runtime: RUNTIME_GENIEX_QAIRT
  technical_details:
  - key: Input sequence length for Prompt Processor
    string_value: '128'
  - key: Maximum context length
    string_value: '4096'
  - key: Quantization Type
    string_value: w4 + w8 (few layers) with fp16 activations and w4a16 + w8a16 (few layers) are supported
  - key: Supported Input Modalities
    string_value: text
  - key: Supported Output Modalities
    string_value: text
separate_quantize_script: true
source_repo: https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct/
supported_precisions:
- PRECISION_W4
- PRECISION_W4A16
tags:
- MODEL_TAG_LLM
- MODEL_TAG_GENERATIVE_AI
templates:
- llama3
- llm
- lm_driver
use_case: MODEL_USE_CASE_TEXT_GENERATION
