description: Llama 3 is a family of LLMs. The model is quantized to w4a16 (4-bit weights and 16-bit activations) and part of the model is quantized to w8a16 (8-bit weights and 16-bit activations) making it suitable for on-device deployment. For Prompt and output length specified below, the time to first token is Llama-PromptProcessor-Quantized's latency and average time per addition token is Llama-TokenGenerator-Quantized's latency.
domain: MODEL_DOMAIN_GENERATIVE_AI
has_multi_graph: true
headline: State-of-the-art large language model useful on a variety of language understanding and generation tasks.
id: llama_v3_1_8b_instruct
is_aimet: true
is_collection_model: true
license_type: MODEL_LICENSE_LLAMA3
license_url: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct/blob/main/LICENSE
local_device_deployment: true
model_type_llm: true
name: Llama-v3.1-8B-Instruct
numerics_benchmark:
  dataset_name: grace2
  metric_name: Grace2
  source: AI Hub Models Reference Eval
  unit: '%'
  value: 90.5
only_allow_orchestrator_runtimes: true
orchestrator_runtimes:
- RUNTIME_GENIEX_QAIRT
- RUNTIME_GENIE
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: MACHINE_GPU
- command: pip install --force-reinstall --no-deps onnxruntime-gpu==1.31.0
  machine: MACHINE_GPU
pre_pip_install_commands:
- command: pip install --force-reinstall torch==2.10.0+cu130 torchvision==0.25.0+cu130 --index-url https://download.pytorch.org/whl/cu130
  machine: MACHINE_GPU
python_version_greater_than_or_equal_to: '3.11'
python_version_greater_than_or_equal_to_reason: onnxruntime 1.31.0 has no Python 3.10 wheels
requires_aot_prepare: true
research_paper: https://github.com/meta-llama/llama-models/blob/main/models/llama3_1/MODEL_CARD.md
research_paper_title: 'LLaMA: Open and Efficient Foundation Language Models'
restrict_model_sharing: true
runtime_technical_details:
- runtime: RUNTIME_GENIEX_QAIRT
  technical_details:
  - key: Input sequence length for Prompt Processor
    string_value: '128'
  - key: Maximum context length
    string_value: '4096'
  - key: Quantization Type
    string_value: w4a16 + w8a16 (few layers)
  - key: Supported Input Modalities
    string_value: text
  - key: Supported Output Modalities
    string_value: text
separate_quantize_script: true
source_repo: https://github.com/meta-llama/llama3/tree/main
supported_precisions:
- PRECISION_W4A16
tags:
- MODEL_TAG_LLM
- MODEL_TAG_GENERATIVE_AI
technical_details:
- key: Language(s) supported
  string_value: English.
- key: Response Rate
  string_value: Rate of response generation after the first response token.
templates:
- llama3
- llm
- lm_driver
use_case: MODEL_USE_CASE_TEXT_GENERATION
