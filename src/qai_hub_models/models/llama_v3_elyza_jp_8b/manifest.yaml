datasets:
- wikitext
description: Llama-3-ELYZA-JP-8B is a lightweight LLM with only 8 billion parameters, yet achieves Japanese language performance comparable to GPT-3.5 Turbo. The model has undergone additional pre-training and post-training of Japanese to expand instruction-following capabilities in Japanese.
domain: Generative AI
has_multi_graph: true
headline: State-of-the-art large language model useful on a variety of language understanding and generation tasks.
id: llama_v3_elyza_jp_8b
is_aimet: true
is_collection_model: true
license: https://huggingface.co/meta-llama/Meta-Llama-3-8B/blob/main/LICENSE
license_type: llama3
local_device_deployment: true
model_type_llm: true
name: Llama-v3-ELYZA-JP-8B
only_allow_orchestrator_runtimes: true
orchestrator_runtimes:
- geniex_qairt
- genie
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: gpu
- command: pip install --force-reinstall --no-deps onnxruntime-gpu==1.23.2
  machine: gpu
requires_aot_prepare: true
research_paper: https://note.com/elyza/n/n360b6084fdbd
research_paper_title: GPT-4 を上回る日本語性能のLLM Llama-3-ELYZA-JP を開発しました
restrict_model_sharing: true
runtime_technical_details:
  geniex_qairt:
    Input sequence length for Prompt Processor: '128'
    Maximum context length: '4096'
    Quantization Type: w4a16 + w8a16 (few layers)
    Supported Input Modalities: text
    Supported Output Modalities: text
separate_quantize_script: true
source_repo: https://huggingface.co/elyza/Llama-3-ELYZA-JP-8B
supported_precisions:
- w4a16
tags:
- llm
- generative-ai
templates:
- llama3
- llm
- lm_driver
use_case: Text Generation
