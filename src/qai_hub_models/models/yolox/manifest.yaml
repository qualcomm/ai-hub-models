description: YoloX is a machine learning model that predicts bounding boxes and classes of objects in an image.
domain: MODEL_DOMAIN_COMPUTER_VISION
has_on_target_demo: true
headline: Real-time object detection optimized for mobile and edge.
id: yolox
license_type: MODEL_LICENSE_APACHE_2_0
license_url: https://github.com/Megvii-BaseDetection/YOLOX/blob/main/LICENSE
name: Yolo-X
numerics_benchmark:
  dataset_name: coco
  metric_name: Mean Average Precision
  source: https://arxiv.org/abs/2107.08430
  unit: mAP
  value: 40.5
post_pip_install_commands:
- command: pip install git+https://github.com/Megvii-BaseDetection/YOLOX.git@6ddff48 --no-deps --no-build-isolation --use-pep517
pre_pip_install_commands:
- command: pip install "torch>=2.1,<=2.14.1" "setuptools>=80"
research_paper: https://github.com/Megvii-BaseDetection/YOLOX/blob/main/README.md
research_paper_title: 'YOLOX: Exceeding YOLO Series in 2021'
source_repo: https://github.com/Megvii-BaseDetection/YOLOX/
