- pip install "torch>=2.1,<=2.14.1" "setuptools>=80"
research_paper: https://github.com/Megvii-BaseDetection/YOLOX/blob/main/README.md
research_paper_title: 'YOLOX: Exceeding YOLO Series in 2021'
