- PRECISION_FLOAT
- PRECISION_W8A8_MIXED_INT16
- PRECISION_W8A16
- PRECISION_W8A8
tags:
- MODEL_TAG_REAL_TIME
templates:
- corevision
- yolo
use_case: MODEL_USE_CASE_OBJECT_DETECTION
