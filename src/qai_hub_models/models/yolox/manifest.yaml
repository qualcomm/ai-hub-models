    qnn_dlc:
      scorecard_accuracy_failure: Torch and On-device accuracy diff (-38.337 mAP@0.5:0.95) above threshold (10.0 mAP@0.5:0.95)
domain: Computer Vision
has_on_target_demo: true
headline: Real-time object detection optimized for mobile and edge.
id: yolox
license: https://github.com/Megvii-BaseDetection/YOLOX/blob/main/LICENSE
license_type: apache-2.0
name: Yolo-X
