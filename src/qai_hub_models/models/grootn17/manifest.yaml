default_device: Samsung Galaxy S25 (Family)
description: |
  GR00T N1.7 is a vision-language-action (VLA) model for generalist robot control. The model uses a Qwen3-VL (Cosmos-Reason2-2B) backbone with mRoPE and DeepStack visual injection, and a 32-layer flow-matching DiT action head, for dexterous, long-horizon manipulation tasks.
