description: ACT (Action Chunking with Transformers) is a robotic policy model that is trained to predict the next chunk of actions that the robotic hand is expected to perform.
domain: MODEL_DOMAIN_COMPUTER_VISION
external_repos:
- commit_sha: 742c753c0d4a5d87076c8f69e5628c79a8cc5488
  name: act
  patches_filename: act_patches.diff
  repo_url: https://github.com/tonyzhaozh/act.git
has_on_target_demo: true
headline: Action Chunking with Transformers.
id: act
license_type: MODEL_LICENSE_MIT
license_url: https://github.com/tonyzhaozh/act/blob/main/LICENSE
name: ACT
pre_pip_install_commands:
- command: pip install dm_control==1.0.36 --no-deps
readme_install_system_deps: |
  #### Linux
  ```bash
  sudo apt install libegl-dev
  ```

  #### Windows
  You can export this model on windows without extra system dependencies.
   To run the demo, you will need to install LibEGL libraries. Options include ANGLE or Mesa3D. This is not a well-tested path; we recommend using WSL or a Linux machine for the demo.
research_paper: https://arxiv.org/abs/2304.13705
research_paper_title: Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware
source_repo: https://github.com/tonyzhaozh/act
