description: Llama 3 is a family of LLMs. The model is quantized to w4a16 (4-bit weights and 16-bit activations) and part of the model is quantized to w8a16 (8-bit weights and 16-bit activations) making it suitable for on-device deployment.
domain: Generative AI
has_multi_graph: true
headline: State-of-the-art large language model useful on a variety of language understanding and generation tasks.
id: llama_v3_2_3b_instruct
is_aimet: true
is_collection_model: true
license: https://huggingface.co/meta-llama/Llama-3.2-3B-Instruct/blob/main/LICENSE.txt
license_type: llama3
lm_quantization_details:
  w4a16:
    precision:
      activations: int16
      blocks:
        granularity: PCQ
        qtype: int4
      embedding: int16
      kv_cache: int8
      lm_head:
        granularity: PCQ
        qtype: int8
    recipe:
    - dataset:
        name: Wikitext
        split: train
      name: SeqMSE
      num_iterations: 20
    - dataset:
        name: Wikitext
        split: train
      name: Calibration
      num_iterations: 20
local_device_deployment: true
model_type_llm: true
name: Llama-v3.2-3B-Instruct
numerics_benchmark:
  dataset_name: grace2
  metric_name: Grace2
  source: AI Hub Models Reference Eval
  unit: '%'
  value: 84.2
only_allow_orchestrator_runtimes: true
orchestrator_runtimes:
- geniex_qairt
- genie
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: gpu
- command: pip install --force-reinstall --no-deps onnxruntime-gpu==1.23.2
  machine: gpu
requires_aot_prepare: true
research_paper: https://github.com/meta-llama/llama-models/blob/main/models/llama3_2/MODEL_CARD.md
research_paper_title: 'LLaMA: Open and Efficient Foundation Language Models'
restrict_model_sharing: true
runtime_technical_details:
  geniex_qairt:
    Input sequence length for Prompt Processor: '128'
    Maximum context length: '4096'
    Quantization Type: w4 + w8 (few layers) with fp16 activations and w4a16 + w8a16 (few layers) are supported
    Supported Input Modalities: text
    Supported Output Modalities: text
separate_quantize_script: true
source_repo: https://huggingface.co/meta-llama/Llama-3.2-3B-Instruct/
supported_precisions:
- w4a16
- w4
tags:
- llm
- generative-ai
templates:
- llama3
- llm
- lm_driver
use_case: Text Generation
