datasets:
- coco
description: Detectron2-Detection is a machine learning model that can detect objects (trained on COCO dataset).
disabled_paths: {}
domain: Computer Vision
has_on_target_demo: true
headline: A next-generation library for object detection.
id: detectron2_detection
is_collection_model: true
license: https://github.com/facebookresearch/detectron2/blob/main/LICENSE
license_type: apache-2.0
name: Detectron2-Detection
numerics_benchmark:
  dataset_name: coco
  metric_name: Mean Average Precision
  source: https://github.com/facebookresearch/detectron2/blob/main/MODEL_ZOO.md
  unit: mAP
  value: 35.7
post_pip_install_commands:
- pip install git+https://github.com/facebookresearch/detectron2.git@8a9d885 --no-build-isolation
pre_pip_install_commands:
- pip install "torch>=2.1,<=2.14.1" "setuptools>=80"
source_repo: https://github.com/facebookresearch/detectron2/
supported_precisions:
- float
- w8a16
- w8a8
templates:
- corevision
- detectron2
- proposal_based_detection
use_case: Object Detection
