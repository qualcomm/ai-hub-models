description: NeuTTS-2E is a compact on-device emotional text-to-speech language model from Neuphonic. It pairs a 236M-parameter Qwen3 causal LM backbone with the NeuCodec 50Hz neural audio codec, and produces natural-sounding 24kHz English speech for four fixed speakers across seven emotions. There is no voice cloning, as the four speakers ship as pre-encoded reference codes, so no reference audio is read and the codec's encoder is never called. The backbone exports as two graphs (a 128-token prefill and a single-token decode) linked into one weight-shared context binary; prompt assembly, emotion conditioning, sampling and NeuCodec decode run on CPU in the app.
