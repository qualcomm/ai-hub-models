datasets:
- imagenet
description: Qwen2.5-VL-7B-Instruct is a multimodal vision-language model with 7 billion parameters that can process both images and text, enabling visual question answering, image description, and other vision-language tasks.
domain: Generative AI
has_multi_graph: true
headline: State-of-the-art vision-language model capable of understanding images and generating text responses.
id: qwen2_5_vl_7b_instruct
is_aimet: true
is_collection_model: true
license: https://huggingface.co/datasets/choosealicense/licenses/blob/main/markdown/apache-2.0.md
license_type: apache-2.0
local_device_deployment: true
model_type_llm: true
name: Qwen2.5-VL-7B-Instruct
numerics_benchmark:
  dataset_name: grace2
  metric_name: Grace2
  source: AI Hub Models Reference Eval
  unit: '%'
  value: 85.7
only_allow_orchestrator_runtimes: true
orchestrator_runtimes:
- geniex_qairt
- geniex_llamacpp
- genie
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: gpu
- command: pip install --force-reinstall torch==2.10.0+cu130 torchvision==0.25.0+cu130 --index-url https://download.pytorch.org/whl/cu130
  machine: gpu
- command: pip install --force-reinstall --no-deps onnxruntime-gpu==1.23.2
  machine: gpu
python_version_less_than: '3.13'
python_version_less_than_reason: onnx 1.17.0 has no Python 3.13 wheels
requires_aot_prepare: true
research_paper: https://arxiv.org/abs/2502.13923
research_paper_title: Qwen2.5-VL Technical Report
runtime_technical_details:
  geniex_llamacpp:
    Model Size: 4.44 GB
    Quantization Type: Q4_0 (GGUF)
    Supported Input Modalities: image, text
    Supported Output Modalities: text
    model_infer_id: unsloth/Qwen2.5-VL-7B-Instruct-GGUF
  geniex_qairt:
    Context lengths: 512, 1024, 2048
    Input image size for Vision Encoder: 504x336
    Input sequence length for Prompt Processor: '128'
    Minimum QNN SDK version required: 2.45.0
    Supported Input Modalities: image, text
    Supported Output Modalities: text
    model_infer_id: ai-hub-models/Qwen2.5-VL-7B-Instruct
separate_quantize_script: true
source_repo: https://huggingface.co/Qwen/Qwen2.5-VL-7B-Instruct
supported_precisions:
- w4a16
- q4_0
tags:
- llm
- vlm
- generative-ai
templates:
- llm
- qwen2_vl
use_case: Text Generation
