description: GroundingDINO-T is a vision-language object detection model that predicts bounding boxes for objects in an image based on text prompts. This model is split into vision, BERT text-encoder, and fusion/decoder components, each compiled independently.
disabled_paths:
  float:
    tflite:
      scorecard_failure: Numeric drift pushes all detections below box_threshold on-device; demo yields zero boxes despite the job completing successfully. Root cause isolated to the fusion_decoder component under tflite - top class-confidence across all 900 queries collapses to ~0.30 sigmoid (vs. ~0.71 for the same query under qnn_context_binary/torch), and the highest-scoring query degenerates to a near full-image box (cx,cy,w,h ~= 0.50,0.50,1.00,1.00) rather than a real detection. Verified isolated to tflite; qnn_context_binary is unaffected (50.93 mAP on-device, see numerics_benchmark).
  mixed_with_float:
    tflite:
      scorecard_failure: QuantizeLinear layer 'QcQuantizeOp_/Constant_1_output_0_q' cannot have output dtype 'uint16'.
