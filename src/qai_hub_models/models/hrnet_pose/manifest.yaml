datasets:
- coco
- mpii
description: HRNet performs pose estimation in high-resolution representations. This recipe runs as a two-component pipeline. An RTMDet-m detector (640x640) finds people in each full COCO scene, then the HRNet pose estimator (256x192) predicts keypoints for every detected person. Both components are included in reported performance and accuracy.
