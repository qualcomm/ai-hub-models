description: An audio event classifier trained on the AudioSet dataset to predict audio events from the AudioSet ontology employing the Mobilenet_v1 depthwise-separable convolution architecture.
domain: MODEL_DOMAIN_AUDIO
has_on_target_demo: true
headline: Audio Event classification Model.
id: yamnet
license_type: MODEL_LICENSE_MIT
license_url: https://github.com/w-hc/torch_audioset/blob/master/LICENSE
name: YamNet
post_pip_install_commands:
- command: pip install git+https://github.com/w-hc/torch_audioset.git
readme_install_system_deps: |
  #### Linux
  ```bash
  sudo apt install ffmpeg
  ```

   #### Windows
  ```
  winget install ffmpeg
  ```
research_paper: https://arxiv.org/abs/1704.04861
research_paper_title: MobileNets Efficient Convolutional Neural Networks for Mobile Vision Applications
source_repo: https://github.com/w-hc/torch_audioset
supported_precisions:
- PRECISION_FLOAT
- PRECISION_W8A16
- PRECISION_W8A8
tags:
- MODEL_TAG_REAL_TIME
technical_details:
- key: Input resolution
  string_value: 1x1x96x64
- key: Model checkpoint
  string_value: yamnet.pth
- key: Model size (float)
  string_value: 14.2 MB
- key: Number of parameters
  string_value: 3.73M
templates:
- corevision
use_case: MODEL_USE_CASE_AUDIO_CLASSIFICATION
