description: Qwen3 is a multilingual large language model series from Alibaba Cloud, excelling in language understanding, generation, coding, and mathematics.
domain: Generative AI
has_multi_graph: true
headline: Multilingual 1.7B parameter language model excelling in reasoning and code generation.
id: qwen3_1_7b
is_aimet: true
is_collection_model: true
license: https://huggingface.co/Qwen/Qwen3-1.7B/blob/main/LICENSE
license_type: apache-2.0
lm_quantization_details:
  w4a16:
    precision:
      activations: int16
      blocks:
        granularity: PCQ
        qtype: int4
      embedding: int16
      kv_cache: int8
      lm_head:
        granularity: PCQ
        qtype: int8
    recipe:
    - enable_r1: true
      enable_r3: true
      name: SpinQuant
    - dataset:
        name: Wikitext
        split: train
      name: AdaScale
      num_batches: 128
      num_iterations: 2048
    - dataset:
        name: Wikitext
        split: train
      name: Calibration
      num_iterations: 20
local_device_deployment: true
model_type_llm: true
name: Qwen3-1.7B
numerics_benchmark:
  dataset_name: grace2
  metric_name: Grace2
  source: AI Hub Models Reference Eval
  unit: '%'
  value: 80.3
only_allow_orchestrator_runtimes: true
orchestrator_runtimes:
- geniex_qairt
- geniex_llamacpp
- genie
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: gpu
- command: pip install --force-reinstall --no-deps onnxruntime-gpu==1.23.2
  machine: gpu
requires_aot_prepare: true
research_paper: https://arxiv.org/abs/2505.09388
research_paper_title: Qwen3 Technical Report
runtime_technical_details:
  geniex_llamacpp:
    Model Size: 1.06 GB
    Quantization Type: Q4_0 (GGUF)
    Supported Input Modalities: text
    Supported Output Modalities: text
    model_infer_id: unsloth/Qwen3-1.7B-GGUF
  geniex_qairt:
    Context lengths: 512, 1024, 2048, 3072, 4096
    Input sequence length for Prompt Processor: '128'
    Minimum QNN SDK version required: 2.45.0
    Supported Input Modalities: text
    Supported Output Modalities: text
    model_infer_id: ai-hub-models/Qwen3-1.7B
separate_quantize_script: true
source_repo: https://huggingface.co/Qwen/Qwen3-1.7B
supported_precisions:
- w4a16
- q4_0
tags:
- llm
- generative-ai
templates:
- llm
- lm_driver
- qwen3
use_case: Text Generation
