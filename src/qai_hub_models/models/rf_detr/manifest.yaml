description: DETR is a machine learning model that can detect objects (trained on COCO dataset).
disabled_paths:
- precision: PRECISION_FLOAT
  runtime: RUNTIME_TFLITE
  scorecard_failure: 'Failing jobs: jpvnzn6jg'
- precision: PRECISION_W8A16
  runtime: RUNTIME_QNN_DLC
  scorecard_failure: 'Failing jobs: jp2z4qx4p'
domain: MODEL_DOMAIN_COMPUTER_VISION
has_on_target_demo: true
headline: Transformer based object detection model architecture developed by Roboflow.
id: rf_detr
license_type: MODEL_LICENSE_APACHE_2_0
license_url: https://github.com/roboflow/rf-detr/blob/develop/LICENSE
name: RF-DETR
outputs_to_skip_validation:
  '0': PSNR is not a meaningful metric for pixel-space bounding box coordinates
  '2': Boxes with low confidence disagree on class index between torch and on-device
research_paper: https://blog.roboflow.com/rf-detr/
research_paper_title: RF-DETR A SOTA Real-Time Object Detection Model
source_repo: https://github.com/roboflow/rf-detr
supported_precisions:
- PRECISION_FLOAT
- PRECISION_W8A16
technical_details:
- key: Input resolution
  string_value: 512x512
- key: Model checkpoint
  string_value: RF-DETR-small
- key: Model size (float)
  string_value: 110 MB
- key: Model size (w8a16)
  string_value: 31.8 MB
- key: Number of parameters
  string_value: 28.5M
- key: Supported variants
  string_value: nano (384x384), small (512x512), medium (576x576), base (560x560)
templates:
- corevision
- detr
use_case: MODEL_USE_CASE_OBJECT_DETECTION
