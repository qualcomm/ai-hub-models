name: Wav2Vec2-Conformer-Large-960h
id: wav2vec2_conformer
headline: English speech recognition with Wav2Vec2-Conformer encoder and CTC decoder.
domain: Audio
description: Facebook Wav2Vec2-Conformer-Large is an English ASR model fine-tuned on 960 hours of LibriSpeech. It uses a Conformer encoder with relative-position attention (24 layers, 1024 hidden dim, 16 heads) and a CTC head for decoding. The model accepts raw 16kHz audio and outputs transcribed text via CTC greedy decoding.
numerics_benchmark:
  dataset_name: librispeech
  metric_name: Word Error Rate
  value: 1.85
  unit: WER
  source: https://huggingface.co/facebook/wav2vec2-conformer-rel-pos-large-960h-ft
use_case: Speech Recognition
