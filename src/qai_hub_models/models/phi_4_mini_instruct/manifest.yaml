description: Phi-4-mini-instruct is a lightweight open model built upon synthetic data and filtered publicly available websites - with a focus on high-quality, reasoning dense data.
domain: Generative AI
has_multi_graph: true
headline: State-of-the-art large language model useful on a variety of language understanding and generation tasks.
id: phi_4_mini_instruct
is_aimet: true
is_collection_model: true
license: https://huggingface.co/microsoft/Phi-4-mini-instruct/blob/main/LICENSE
license_type: mit
lm_quantization_details:
  w4a16:
    precision:
      activations: int16
      blocks:
        granularity: PCQ
        qtype: int4
      embedding: int16
      kv_cache: int8
      lm_head:
        granularity: PCQ
        qtype: int8
    recipe:
    - enable_r1: true
      enable_r2: true
      enable_r3: true
      name: SpinQuant
    - dataset:
        name: Wikitext
        split: train
      name: SeqMSE
    - dataset:
        name: Wikitext
        split: train
      name: Calibration
      num_iterations: 128
model_type_llm: true
name: Phi-4-Mini-Instruct
numerics_benchmark:
  dataset_name: grace2
  metric_name: Grace2
  source: AI Hub Models Reference Eval
  unit: '%'
  value: 91.1
orchestrator_runtimes:
- geniex_qairt
- geniex_llamacpp
- genie
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: gpu
- command: pip install --force-reinstall --no-deps onnxruntime-gpu==1.23.2
  machine: gpu
requires_aot_prepare: true
research_paper: https://arxiv.org/abs/2412.08905
research_paper_title: Phi-4 Technical Report
runtime_technical_details:
  geniex_llamacpp:
    Model Size: 2.33 GB
    Quantization Type: Q4_0 (GGUF)
    Supported Input Modalities: text
    Supported Output Modalities: text
    model_infer_id: bartowski/microsoft_Phi-4-mini-instruct-GGUF
  geniex_qairt:
    Context lengths: 512, 1024, 2048, 3072, 4096
    Input sequence length for Prompt Processor: '128'
    Minimum QNN SDK version required: 2.45.0
    Supported Input Modalities: text
    Supported Output Modalities: text
    model_infer_id: ai-hub-models/Phi-4-mini-instruct
separate_quantize_script: true
source_repo: https://huggingface.co/microsoft/Phi-4-mini-instruct
supported_precisions:
- w4a16
- q4_0
tags:
- llm
- generative-ai
templates:
- llm
- lm_driver
- phi
use_case: Text Generation
