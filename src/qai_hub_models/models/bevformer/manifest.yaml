datasets:
- nuscenes
description: Bevformer is a SOTA model of interest to the Auto BU.
disabled_paths:
  float:
    tflite:
      scorecard_failure: 'Failing jobs: jgjr4dr8p'
domain: Computer Vision
external_repos:
  bevformer:
    commit_sha: 66b65f3a1f58caf0507cb2a971b9c0e7f842376c
    patches_filename: bevformertiny_minimal.diff
    repo_url: https://github.com/fundamentalvision/BEVFormer.git
has_on_target_demo: true
headline: Transform temporal multi-view images into a unified bird's eye scene.
id: bevformer
license: https://github.com/fundamentalvision/BEVFormer/blob/master/LICENSE
license_type: apache-2.0
name: BEVFormer
pre_pip_install_commands:
- pip install wheel "setuptools<82.0.0"
- pip install mmcv==1.7.0 --no-deps --no-build-isolation
- pip install git+https://github.com/open-mmlab/mmdetection3d.git@v1.0.0rc4 --no-deps --no-build-isolation
python_version_less_than: '3.13'
python_version_less_than_reason: nuscenes-devkit 1.2.0 (latest) requires numpy<2, which has no Python 3.13 wheels
research_paper: https://arxiv.org/abs/2203.17270
research_paper_title: "BEVFormer: Learning Bird's-Eye-View Representation from Multi-Camera Images via Spatiotemporal Transformers"
source_repo: https://github.com/fundamentalvision/BEVFormer/
tags:
- bu-auto
use_case: Driver Assistance
