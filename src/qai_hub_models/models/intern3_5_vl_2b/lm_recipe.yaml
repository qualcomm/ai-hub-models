w4a16:
  precision:
    activations: int16
    blocks:
      granularity: PCQ
      qtype: int4
    embedding: int16
    kv_cache: int8
    lm_head:
      granularity: PCQ
      qtype: int8
    visual:
      activations: int16
      weight:
        granularity: PCQ
        qtype: int8
  recipe:
    backbone:
    - enable_r1: true
      enable_r3: true
      name: SpinQuant
    - dataset:
        name: Wikitext
        split: train
      name: AdaScale
      num_batches: 128
      num_iterations: 2048
    - dataset:
        name: Interleaved
        source_datasets:
        - name: AOKVQA
          split: train
        - name: Wikitext
          split: train
      name: Calibration
      num_iterations: 20
    visual:
    - enable_r1: true
      enable_r3: true
      name: SpinQuant
    - dataset:
        name: AOKVQA
        split: train
      name: Calibration
      num_iterations: 64
