description: Falcon3 family of Open Foundation Models is a set of pretrained and instruct LLMs ranging from 1B to 10B.
domain: MODEL_DOMAIN_GENERATIVE_AI
has_multi_graph: true
headline: State-of-the-art large language model useful on a variety of language understanding and generation tasks.
id: falcon_v3_7b_instruct
is_aimet: true
is_collection_model: true
license_type: MODEL_LICENSE_FALCON3
license_url: https://falconllm.tii.ae/falcon-terms-and-conditions.html
local_device_deployment: true
model_type_llm: true
name: Falcon3-7B-Instruct
numerics_benchmark:
  dataset_name: grace2
  metric_name: Grace2
  source: AI Hub Models Reference Eval
  unit: '%'
  value: 79.4
only_allow_orchestrator_runtimes: true
orchestrator_runtimes:
- RUNTIME_GENIEX_QAIRT
- RUNTIME_GENIE
post_pip_install_commands:
- command: pip uninstall -y onnxruntime
  machine: MACHINE_GPU
- command: pip install --force-reinstall --no-deps onnxruntime-gpu==1.31.0
  machine: MACHINE_GPU
pre_pip_install_commands:
- command: pip install --force-reinstall torch==2.10.0+cu130 torchvision==0.25.0+cu130 --index-url https://download.pytorch.org/whl/cu130
  machine: MACHINE_GPU
python_version_greater_than_or_equal_to: '3.11'
python_version_greater_than_or_equal_to_reason: onnxruntime 1.31.0 has no Python 3.10 wheels
requires_aot_prepare: true
restrict_model_sharing: true
runtime_technical_details:
- runtime: RUNTIME_GENIEX_QAIRT
  technical_details:
  - key: Context length
    string_value: '4096'
  - key: Input sequence length for Prompt Processor
    string_value: '128'
  - key: Quantization Type
    string_value: w4a16 + w8a16 (few layers)
  - key: Supported Input Modalities
    string_value: text
  - key: Supported Output Modalities
    string_value: text
separate_quantize_script: true
source_repo: https://huggingface.co/tiiuae/Falcon3-7B-Instruct
supported_precisions:
- PRECISION_W4A16
tags:
- MODEL_TAG_LLM
- MODEL_TAG_GENERATIVE_AI
technical_details:
- key: Response Rate
  string_value: Rate of response generation after the first response token.
- key: Supported languages
  string_value: English, French, Spanish, Portuguese.
templates:
- llama3
- llm
- lm_driver
use_case: MODEL_USE_CASE_TEXT_GENERATION
