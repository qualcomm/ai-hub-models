description: 'A YOLOv8-nano object detection model fine-tuned on the UAE licence-plate dataset (Roboflow car-plate-k6xij v26). The model detects and classifies 51 object classes: digits 0-9, letters A-Z, UAE emirate region identifiers and a plate bounding-box class for the full plate region.'
domain: Computer Vision
has_on_target_demo: true
headline: YOLOv8-based detector for UAE licence plates — characters, digits, and emirate identifiers.
